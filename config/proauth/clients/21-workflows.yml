      name: fulfilment
  scopes:
    - id: e3559c20-8d19-46c8-915b-0431f33f7f5b
      key: fulfilment.create
      name: fulfilment.create
  metadata:
    - key: tokenexchangeenabled
      value: "true"
  tokenExchangePolicies:
    - id: f46c7b1e-f4fa-479a-b9ea-53a52c14261b
      name: Validated Workplace request to Fulfilment
      enabled: true
      allowRefreshTokens: false
      tenantId: e428f9e9-fb58-47a6-8de4-e66f09f382df
      sourceClientAppId: 77ec4815-e6d7-4740-bb46-a19146e6f77f
      inputAudience: urn:mervikon:procurement
      requiredInputScopes: procurement.write
      inputBinding: Dpop
      outputAudience: urn:mervikon:fulfilment
      allowedOutputScopes: fulfilment.create
      outputBinding: Dpop
      maximumLifetimeSeconds: 120
  authenticationAssurancePolicies:
    - id: 3d6062be-eb27-464e-a997-094e491050e5
      name: assurance-exchange-fulfilment
      tenantId: e428f9e9-fb58-47a6-8de4-e66f09f382df
      audience: urn:mervikon:fulfilment
      mode: EvidenceOnly
      includeAuthenticationMethods: false
relationships:
  tenants:
    mode: set
    refs:
      - id: e428f9e9-fb58-47a6-8de4-e66f09f382df
  allowedTokenExchangeClientApps:
    mode: set
    refs:
      - id: 77ec4815-e6d7-4740-bb46-a19146e6f77f
---
apiVersion: management.proauth.net/v2
kind: ClientAppAuthenticationConfiguration
metadata:
  id: 76bc9abe-8333-4f4a-badf-bb7c4b4bc1d1
spec:
  tokenEndpointAuthMethod: client_secret_basic
  # Bind issued tokens to the sender key. The receiving API must validate the request proof.
  dpopBoundAccessTokens: true
  tokenExchangeMode: Policy
