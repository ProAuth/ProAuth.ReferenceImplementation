{{- $name := printf "%s-mervikon" .Release.Name -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ $name }}-redis }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.redis.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }}-redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ $name }}-redis }
  template:
    metadata:
      labels: { app: {{ $name }}-redis, mervikon-instance: {{ $name }} }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: [redis-server, --appendonly, "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts: [{ name: state, mountPath: /data }]
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: {{ $name }}-redis }
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}-redis }
spec:
  selector: { app: {{ $name }}-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-redis }
spec:
  podSelector:
    matchLabels: { app: {{ $name }}-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: {{ $name }}-workplace }
      ports: [{ protocol: TCP, port: 6379 }]
