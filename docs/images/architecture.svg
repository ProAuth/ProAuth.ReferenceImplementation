<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="-15 0 1130 514" role="img" aria-labelledby="title description">
<title id="title">ProAuth reference application architecture</title>
<desc id="description">External ProAuth serves three browser and BFF applications: Workplace, Supplier Portal and Finance Desk. Each calls its business API: Procurement, Fulfilment or Treasury. Procurement exchanges a token at ProAuth and hands approved orders to Fulfilment. Treasury reads receipts from Fulfilment. A separate opt-in lab contains browser clients, protected APIs and capture/replay tools. Demo Console observes recorded evidence outside the request path. Workers and infrastructure are omitted.</desc>
<!-- Static adaptation of the presentation architecture diagram; no presentation runtime required. -->
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#0041c8"/></marker>
  <marker id="lab-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#718096"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .group { font-size:11px; letter-spacing:1px; fill:#53647b; }
  .title { font-size:20px; font-weight:600; fill:#001847; }
  .detail { font-size:12px; fill:#304b73; }
  .caption { font-size:12px; fill:#53647b; }
  .business { fill:#edf3ff; stroke:#0041c8; stroke-width:1.7; }
  .lab { fill:#fafbfd; stroke:#a4b3c8; stroke-width:1.2; }
</style>
