<g id="quote" transform="translate(280,386)"><rect class="lab" width="220" height="72" rx="4"/><text x="14" y="29" class="title">Lab / protocol APIs</text><text x="14" y="52" class="detail">Audience · token · sender controls</text></g>
<g id="attack" transform="translate(532,386)"><rect class="lab" width="220" height="72" rx="4"/><text x="14" y="29" class="title">Capture + attacker</text><text x="14" y="52" class="detail">Controlled theft and replay</text></g>
<g id="console" transform="translate(790,386)"><rect class="business" width="300" height="72" rx="4"/><text x="14" y="29" class="title">Demo Console</text><text x="14" y="52" class="detail">Sanitized observations · evidence viewer</text></g>
<text x="320" y="301" class="caption">Handoff</text>
